[env:LoRa]
platform = ${env:rp2040.platform} 
board = ${env:rp2040.board} 
platform_packages = ${env:rp2040.platform_packages}
board_build.core = ${env:rp2040.board_build.core}
board_build.filesystem_size = 0.5m
